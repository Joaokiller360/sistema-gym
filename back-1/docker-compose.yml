
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: ${PORT:-3001}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:3001}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      WALLETWALLET_API_KEY: ${WALLETWALLET_API_KEY}
      WALLETWALLET_API_URL: ${WALLETWALLET_API_URL:-https://api.walletwallet.dev}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v21.0}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET}
      WHATSAPP_TEMPLATE_LANG: ${WHATSAPP_TEMPLATE_LANG:-es}
      WHATSAPP_TEMPLATE_CONTACT: ${WHATSAPP_TEMPLATE_CONTACT:-gymos_contacto}
      WHATSAPP_TEMPLATE_LIMIT_WARNING: ${WHATSAPP_TEMPLATE_LIMIT_WARNING:-gymos_limite_plan_aviso}
      WHATSAPP_TEMPLATE_LIMIT_REACHED: ${WHATSAPP_TEMPLATE_LIMIT_REACHED:-gymos_limite_plan_alcanzado}
      ZERNIO_API_KEY: ${ZERNIO_API_KEY}
      ZERNIO_WHATSAPP_ACCOUNT_ID: ${ZERNIO_WHATSAPP_ACCOUNT_ID}
      ZERNIO_WEBHOOK_SECRET: ${ZERNIO_WEBHOOK_SECRET}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-gymos-backups}
      S3_UPLOADS_BUCKET: ${S3_UPLOADS_BUCKET:-gymos-uploads}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      BACKUP_CRON: ${BACKUP_CRON:-0 4 * * *}
      BACKUP_TIMEZONE: ${BACKUP_TIMEZONE:-America/Guayaquil}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - uploads_data:/app/uploads
    networks:
      - default
      - dokploy-network

volumes:
  uploads_data:
    driver: local

networks:
  default:
  dokploy-network:
    external: true
    name: dokploy-network
